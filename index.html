<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DHEX AB – Apps</title>
  <meta name="description" content="Apps and games by DHEX AB.">
  <link rel="icon" href="cookie-blaster/icon.png">
  <style>
    :root { --bg: #FFF4E0; --card: #FFFFFF; --text: #5D3A1A; --soft: #8A6A4E; --accent: #D8638D; --line: #F0DDC0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .lead { color: var(--soft); margin-top: 0; }
    .app {
      display: flex; gap: 16px; align-items: center; background: var(--card); border-radius: 20px;
      padding: 16px; margin: 24px 0; box-shadow: 0 2px 0 var(--line);
    }
    .app img { width: 80px; height: 80px; border-radius: 20px; flex: none; }
    .app h2 { margin: 0; font-size: 1.3rem; }
    .app p { margin: 4px 0 8px; color: var(--soft); }
    a { color: var(--accent); font-weight: 700; }
    footer { color: var(--soft); font-size: 0.9rem; margin-top: 40px; }
  </style>
</head>
<body>
<main>
  <h1>DHEX AB</h1>
  <p class="lead">Apps and games · Appar och spel</p>

  <div class="app">
    <img src="cookie-blaster/icon.png" alt="Cookie Blaster app icon" width="80" height="80">
    <div>
      <h2>Cookie Blaster</h2>
      <p>A cookie puzzle game for kids. · Ett kakpussel för barn.</p>
      <a href="cookie-blaster/privacy/">Privacy Policy · Integritetspolicy</a>
    </div>
  </div>

  <footer>Contact · Kontakt: <a href="mailto:support@dhexab.com">support@dhexab.com</a><br>© 2026 DHEX AB</footer>
</main>
</body>
</html>
